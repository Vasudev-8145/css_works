<!DOCTYPE html>
<html lang="en">
<head>

    <style>

        h1{
            background-color: black;
            color: red;
        }

        h2{
            background-color: yellow;
            color: purple;
            border: 2px solid red;
        }

        .heading{
            background-color: blue;
            color: yellow;
        }

        .bg-danger{
            background-color: red;
            color: white;
        }

        .border-success{
            border: 3px solid green;
        }

        .bg-primary{
            background-color: blue;
        }

        .text-white{
            color: white;
        }
         
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
</head>
<body>
    
    <h1>Internal css</h1>
    <h2>Internal css journey starts here</h2>
    <h1 class="heading">Python Django</h1>
    <h1 class="bg-danger border-success">Data science</h1>
    <h1 class="bg-primary text-white">ASP .NET</h1>

</body>
</html>
